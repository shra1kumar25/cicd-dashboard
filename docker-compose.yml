services:
  postgres:
    image: postgres:16
    container_name: cicd-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cicd_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cicd_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cicd-dashboard-backend:v1
    container_name: cicd-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_dashboard
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
